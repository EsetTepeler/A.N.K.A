services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: anka-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: anka-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  core:
    build: ./core
    container_name: anka-core
    ports:
      # Host portu .env'deki ANKA_PORT ile degistirilebilir (konteyner ici hep 8000)
      - "${ANKA_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - ANKA_DB_PATH=/data/anka.db
      - ANKA_PROJECTS_ROOT=/projects
    volumes:
      - core_data:/data
      # Indexlenecek kod projelerinin bulundugu dizin (.env: ANKA_PROJECTS_DIR)
      - ${ANKA_PROJECTS_DIR:-./projects}:/projects:ro
    depends_on:
      - redis
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_data:
  redis_data:
  core_data:
